schema_version: 1

context:
  version: "7.0.4"

package:
  name: envisage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/envisage/envisage-${{ version }}.tar.gz
  sha256: d6bb2938bbb45c4ef1766c55ed6f6c1c72b6fce70468ac9f5b0efcd1ef8c1d97

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - apptools >=5.3
    - pyface
    # envisage needs pkg_resources
    - setuptools <82
    - traits >=6.2
    - traitsui

tests:
  - python:
      imports:
        - envisage
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: extensible application framework
  homepage: http://docs.enthought.com/envisage/

extra:
  recipe-maintainers:
    - grlee77
    - JaRoSchm
