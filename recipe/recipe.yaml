schema_version: 1

context:
  version: "8.0.1"

package:
  name: envisage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/e/envisage/envisage-${{ version }}.tar.gz
  sha256: b0f55d99498e791362a0f918f51d7f1b52c9f00ae38888470545729d6195ac78

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - apptools >=5.3
    - pyface
    # envisage needs pkg_resources
    - setuptools <82
    - traits >=6.2
    - traitsui

tests:
  - python:
      imports:
        - envisage
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: extensible application framework
  homepage: http://docs.enthought.com/envisage/

extra:
  recipe-maintainers:
    - grlee77
    - JaRoSchm
